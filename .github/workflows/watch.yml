name: EBM Wohnungs-Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Test-Push senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ebm-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ebm-watcher
    steps:
      - uses: actions/checkout@v4

      - name: Seite prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 watcher.py --test
          else
            python3 watcher.py
          fi

      - name: Stand speichern
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ebm-watcher"
            git config user.email "ebm-watcher@users.noreply.github.com"
            git add state.json
            git commit -m "Stand aktualisiert"
            git push
          fi
